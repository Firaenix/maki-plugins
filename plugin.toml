min_maki_version = "0.5.0"

[permissions]
# Every key granted: remote's maki.session.answer_permission answers for the
# user, which maki allows only a fully trusted plugin.
fs_read = true
fs_write = true
net = true
run = true
env = true
agent = true
# maki 0.6.5 gates the session APIs and strips conversation fields from
# events (InputChanged's text, TurnStart's text) without these.
session_read = true
session_write = true
session_settings = true
